application:
  enable-perf-measurement: 1
  perf-measurement-interval-sec: 1

source0:
  enable: 1
  type: 2
  uri: file:///opt/nvidia/deepstream/deepstream/samples/streams/sample_720p.mp4

streammux:
  live-source: 0
  batch-size: 1
  batched-push-timeout: 100000
  width: 1280
  height: 720
  nvbuf-memory-type: 0

primary-gie:
  enable: 1
  gie-unique-id: 1
  batch-size: 1
  config-file: /opt/nvidia/deepstream/deepstream/samples/configs/deepstream-app/config_infer_primary.txt

tiled-display:
  enable: 0

osd:
  enable: 0

sink0:
  enable: 1
  type: 2
  sync: 1
  qos: 1

tests:
  file-loop: 1
